{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FoodDen{% endblock %}</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'app/css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="navbar-logo">FoodDen</div>

    <ul class="nav-links">
        <li>
            <a href="{% url 'home' %}" class="nav-link">Home</a>
        </li>

        <li>
            <a href="{% url 'cart' %}" class="nav-link cart-link">
                🛒 Cart
                <span class="cart-badge" id="cart-count">{{ cart_count }}</span>
            </a>
        </li>

        <li>
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="nav-link logout-btn">
                        Logout
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link">Login</a>
            {% endif %}
        </li>
    </ul>
</nav>

<!-- PAGE CONTENT -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="footer">
    <p>© 2025 FoodDen. All rights reserved.</p>
</footer>

<!-- JS -->
<script src="{% static 'app/js/script.js' %}"></script>
<script src="{% static 'app/js/cursor.js' %}"></script>
<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function addToCart(foodId) {
    fetch(`/add-to-cart/${foodId}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": getCookie('csrftoken'),
        }
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            document.getElementById("cart-count").innerText = data.cart_count;
        } else if (data.login_required) {
            window.location.href = "/login/?next=" + window.location.pathname;
        }
    });
}
</script>
